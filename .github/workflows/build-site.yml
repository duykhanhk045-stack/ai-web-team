name: Tạo web từ yêu cầu

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: contains(github.event.issue.labels.*.name, 'yeu-cau-web') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openai

      - run: python build_site.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - uses: peter-evans/create-pull-request@v6
        with:
          title: "Tạo web từ yêu cầu #${{ github.event.issue.number }}"
          body: "Web do team AI tạo theo yêu cầu #${{ github.event.issue.number }}. Hãy xem kỹ rồi mới Merge."
          branch: ai/site-${{ github.event.issue.number }}
          commit-message: "Tạo web từ yêu cầu #${{ github.event.issue.number }}"
          add-paths: sites/

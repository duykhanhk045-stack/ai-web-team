name: Weekly AI Team

on:
  schedule:
    - cron: '0 2 * * 6'   # 9h sáng thứ 7 giờ Hà Nội
  workflow_dispatch:       # cho phép bấm chạy tay để test

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openai

      - run: python weekly_team.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - uses: peter-evans/create-pull-request@v6
        with:
          title: "Báo cáo AI hàng tuần"
          branch: ai/weekly-report
          commit-message: "Báo cáo AI hàng tuần"
          add-paths: weekly_report.md
